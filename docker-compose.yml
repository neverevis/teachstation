services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: teachstation
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./teachstation.sql:/docker-entrypoint-initdb.d/teachstation.sql

volumes:
  db_data: