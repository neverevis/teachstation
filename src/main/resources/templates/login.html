<!DOCTYPE html>
<html lang="pt-BR">
	<head>
	    <meta charset="UTF-8">
		<link rel="stylesheet" th:href="@{/css/styles.css}">
	    <title>Login - TeachStation</title>
	</head>
	<body>

	    <main class="pagina-login">
			<section class="apresentacao-login">
	            <h1>TeachStation</h1>
	            <p>
	                Aprenda no seu ritmo.
	            </p>
	        </section>

	        <section class="login-container">
	            <h2>Acesse sua conta</h2>

	            <form action="/login" method="POST">
	                <div class="campo-formulario">
	                    <label for="username">E-mail:</label>
	                    <input type="text" id="username" name="username" required>
	                </div>

	                <div class="campo-formulario">	                
	                    <label for="password">Senha:</label>
	                    <div class="input-senha-wrapper">
	                        <input type="password" id="password" name="password" required>
	                        <button type="button" id="togglePass" class="botao-olho" aria-label="Mostrar senha" title="Mostrar senha">
	                            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
	                            <svg class="icone-olho-fechado" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
	                        </button>
	                    </div>
	                </div>

	                <button type="submit">Entrar</button>

	            </form>

	            <p>Esqueceu a senha? <a href="/redefinir-senha" th:href="@{/redefinir-senha}">Redefinir Senha</a></p>

	        </section>
	    </main>
		
		<div th:replace="~{fragments/toast :: toast}"></div>
		
		<div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>
		<script>
			"use strict"
			const password = document.getElementById("password");
			const toggle = document.getElementById("togglePass");
			
			toggle.onclick = function () {
			    const mostrar = password.getAttribute("type") === "password";
			    password.setAttribute("type", mostrar ? "text" : "password");
			    toggle.querySelector(".icone-olho-aberto").hidden = mostrar;
			    toggle.querySelector(".icone-olho-fechado").hidden = !mostrar;
			    toggle.setAttribute("title", mostrar ? "Esconder senha" : "Mostrar senha");
			    toggle.setAttribute("aria-label", mostrar ? "Esconder senha" : "Mostrar senha");
			};
		</script>
		
	</body>
</html>
