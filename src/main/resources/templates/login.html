<!DOCTYPE html>
<html lang="pt-BR">
	<head>
	    <meta charset="UTF-8">
		<link rel="stylesheet" th:href="@{/css/styles.css}">
	    <title>Login - TeachStation</title>
	</head>
	<body>

	    <main class="pagina-login">
			<section class="apresentacao-login">
	            <h1>TeachStation</h1>
	            <p>
	                Aprenda no seu ritmo.
	            </p>
	        </section>

	        <section class="login-container">
	            <h2>Acesse sua conta</h2>

	            <form action="/login" method="POST">
	                <div class="campo-formulario">
	                    <label for="username">E-mail:</label>
	                    <input type="text" id="username" name="username" required>
	                </div>

	                <div class="campo-formulario">
	                    <label for="password">Senha:</label>
	                    <input type="password" id="password" name="password" required>
	                    <button type="button" id="togglePass">Mostrar Senha</button>
	                </div>

	                <button type="submit">Entrar</button>

	            </form>

	            <p>Esqueceu a senha? <a href="/redefinir-senha" th:href="@{/redefinir-senha}">Redefinir Senha</a></p>

	        </section>
	    </main>
		
		<div th:replace="~{fragments/toast :: toast}"></div>
		
		<div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>
		<script>
			"use strict"
			const input = document.querySelector("input");
			const button = document.querySelector("#togglePass");
			button.addEventListener('click', togglePass);
			
			function togglePass(){
			if (input.type == "password"){
				input.type = "text";
				button.textContent = "Esconder Senha";
				}else{
					input.type = "password";
					button.textContent = "Mostrar Senha";
				}
			}

</script>
		
	</body>
</html>
