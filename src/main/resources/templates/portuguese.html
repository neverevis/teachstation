<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<link rel="icon" type="image/png" th:href="@{/images/logo-teachstation.png}">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<style>html { touch-action: pan-x pan-y; }</style>
		<script th:src="@{/js/travar-zoom.js}"></script>
		<link rel="stylesheet" th:href="@{/css/styles.css}">
		<link rel="stylesheet" th:href="@{/css/study-map.css}">
		<link rel="stylesheet" th:href="@{/css/study-map-bloqueio.css}">
		<title>Língua Portuguesa - Fases</title>
	</head>
<body>
	<div th:replace="~{fragments/cabecalho :: cabecalho}"></div>
	<div class="map-container">
		<div class="map-background"></div>

		<div>
			<a th:href="@{#}">
				<div id="btn1" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn2" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn3" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn4" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn5" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn6" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn7" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn8" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn9" class="map-button">
				</div>
			</a>

			<a th:href="@{#}">
				<div id="btn10" class="map-button">
				</div>
			</a>

			<div id="game-card" class="game-card">
				<div class="game-card-cover">
					<span id="game-card-phase" class="game-card-phase">Fase 1</span>
				</div>
				<p class="game-card-title">Pronto para começar?</p>
				<a id="game-card-link" th:href="@{#}" class="game-card-btn">INICIAR</a>
			</div>
		</div>
	</div>
	<script th:src="@{/js/map.js}"></script>
	<script>

		// x% = (pixelX / larguraOriginalDoMapa) * 100
		// x% = ( 60 / 1920) * 100
		// y% = (pixelY / alturaOriginalDoMapa) * 100

		let botao1 = document.getElementById("btn1");
		let botao2 = document.getElementById("btn2");
		let botao3 = document.getElementById("btn3");
		let botao4 = document.getElementById("btn4");
		let botao5 = document.getElementById("btn5");
		let botao6 = document.getElementById("btn6");
		let botao7 = document.getElementById("btn7");
		let botao8 = document.getElementById("btn8");
		let botao9 = document.getElementById("btn9");
		let botao10 = document.getElementById("btn10");


		let gameCard = document.getElementById("game-card")
		let gameCardLink = document.getElementById("game-card-link");
		let gameCardPhase = document.getElementById("game-card-phase");
		let gameCardTitle = gameCard.querySelector(".game-card-title");


		let levels = [
		    { button: botao1, position: new Vector2((221.7 / 1920) * 100, (851.7 / 1080) * 100) },
		    { button: botao2, position: new Vector2((395.7 / 1920) * 100, (659.7 / 1080) * 100) },
		    { button: botao3, position: new Vector2((623.7 / 1920) * 100, (743.7 / 1080) * 100) },
		    { button: botao4, position: new Vector2((917.7 / 1920) * 100, (683.7 / 1080) * 100) },
		    { button: botao5, position: new Vector2((1199.7 / 1920) * 100, (737.7 / 1080) * 100) },
		    { button: botao6, position: new Vector2((1493.7 / 1920) * 100, (623.7 / 1080) * 100) },
		    { button: botao7, position: new Vector2((1421.7 / 1920) * 100, (407.7 / 1080) * 100) },
		    { button: botao8, position: new Vector2((1223.7 / 1920) * 100, (347.7 / 1080) * 100) },
		    { button: botao9, position: new Vector2((1067.7 / 1920) * 100, (227.7 / 1080) * 100) },
		    { button: botao10, position: new Vector2((989.7 / 1920) * 100, (65.7 / 1080) * 100) }
		];

		/*
			btn1:
			btn2: (534 / 1920) * 100, (656 / 1080) * 100)
			btn3: (694 / 1920) * 100, (518 / 1080) * 100)
			btn4:
			btn5:
			btn6: (1199 / 1920) * 100, (626 / 1080) * 100)
		 */

		let gameObjects = levels.map(level => new GameObject(level.button, level.position));

		let cardObject = new GameCard(gameCard, levels[0].position, 35 )

		let fasesDisponiveis = [1];
		let faseSelecionada = 1;

		function faseDisponivel(numero) {
			return fasesDisponiveis.includes(numero);
		}

		function atualizarBloqueios() {
			levels.forEach((level, index) => {
				level.button.classList.toggle("map-button-bloqueado", !faseDisponivel(index + 1));
			});
		}

		function selecionarFase(numero, animar) {
			const level = levels[numero - 1];
			faseSelecionada = numero;

			if (animar) {
				cardObject.animateTo(level.position, 400);
			} else {
				cardObject.setPosition(level.position);
			}
			gameCardPhase.textContent = `Fase ${numero}`;

			if (faseDisponivel(numero)) {
				gameCard.classList.remove("game-card-bloqueada");
				gameCardTitle.textContent = "Pronto para começar?";
				gameCardLink.textContent = "INICIAR";
				gameCardLink.setAttribute("href", `/studyarea/portuguese/level${numero}`);
				gameCardLink.removeAttribute("aria-disabled");
			} else {
				gameCard.classList.add("game-card-bloqueada");
				gameCardTitle.textContent = "🔒 Fase bloqueada";
				gameCardLink.textContent = "BLOQUEADA";
				gameCardLink.setAttribute("href", "#");
				gameCardLink.setAttribute("aria-disabled", "true");
			}
		}

		// Fase bloqueada não navega
		gameCardLink.addEventListener("click", (event) => {
			if (gameCardLink.getAttribute("aria-disabled") === "true") {
				event.preventDefault();
			}
		});

		levels.forEach((level, index) => {
			level.button.addEventListener("click", (event) => {
				event.preventDefault();
				selecionarFase(index + 1, true);
			});
		});

		// ---------- Navegação pelo teclado ----------
		// Setas: movem o cartão para o botão mais próximo na direção escolhida.
		// Enter: abre a fase selecionada, quando ela está liberada.
		const DIRECOES = {
			ArrowUp:    { x: 0,  y: -1 },
			ArrowDown:  { x: 0,  y: 1 },
			ArrowLeft:  { x: -1, y: 0 },
			ArrowRight: { x: 1,  y: 0 }
		};

		// Posições em pixels do mapa original (1920 x 1080), para a distância não distorcer
		function posicaoEmPixels(numero) {
			const p = levels[numero - 1].position;
			return { x: (p.x / 100) * 1920, y: (p.y / 100) * 1080 };
		}

		// Devolve o número da fase mais próxima na direção pedida, ou null se não houver nenhuma
		function faseNaDirecao(numeroAtual, direcao) {
			const origem = posicaoEmPixels(numeroAtual);
			let melhor = null;
			let melhorPontuacao = Infinity;
			let melhorNoCone = false;

			levels.forEach((level, index) => {
				const numero = index + 1;
				if (numero === numeroAtual) {
					return;
				}
				const destino = posicaoEmPixels(numero);
				const dx = destino.x - origem.x;
				const dy = destino.y - origem.y;
				const aolongo = dx * direcao.x + dy * direcao.y;      // quanto avança na direção
				const lateral = Math.abs(dx * direcao.y - dy * direcao.x); // quanto desvia para o lado
				if (aolongo <= 0) {
					return;
				}
				const noCone = lateral <= aolongo * 1.2;               // até uns 50 graus de desvio
				const pontuacao = aolongo + lateral * 2;               // prefere o mais perto e mais alinhado
				if ((noCone && !melhorNoCone) || (noCone === melhorNoCone && pontuacao < melhorPontuacao)) {
					melhor = numero;
					melhorPontuacao = pontuacao;
					melhorNoCone = noCone;
				}
			});
			return melhor;
		}

		document.addEventListener("keydown", (event) => {
			if (event.ctrlKey || event.metaKey || event.altKey) {
				return;
			}
			const direcao = DIRECOES[event.key];
			if (direcao) {
				event.preventDefault(); // evita rolar a página com as setas
				const destino = faseNaDirecao(faseSelecionada, direcao);
				if (destino !== null) {
					selecionarFase(destino, true);
				}
				return;
			}
			// Enter com o foco no corpo da página abre a fase (com o foco no INICIAR, o próprio link já cuida)
			if (event.key === "Enter" && document.activeElement === document.body && faseDisponivel(faseSelecionada)) {
				window.location.href = `/studyarea/portuguese/level${faseSelecionada}`;
			}
		});

		atualizarBloqueios();
		selecionarFase(1, false);

		fetch("/studyarea/portuguese/quiz/api/fases", {headers: {"Accept": "application/json"}})
			.then((resposta) => resposta.ok ? resposta.json() : [])
			.then((lista) => {
				if (Array.isArray(lista) && lista.length > 0) {
					fasesDisponiveis = lista;
					atualizarBloqueios();
					selecionarFase(faseSelecionada, false);
				}
			})
			.catch(() => { /* sem resposta do servidor: continua só com a fase 1 liberada */ });

	</script>

	<div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>

</body>
</html>
