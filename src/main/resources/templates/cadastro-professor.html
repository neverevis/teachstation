<!DOCTYPE html>
<html lang="pt-BR">
	<head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">

		<link rel="stylesheet" th:href="@{/css/styles.css}">
		<title>Cadastro de Professor - TeachStation</title>
	</head>
	<body>
		<main class="pagina-login">
		    <section class="apresentacao-login">
		        <a th:replace="~{fragments/voltar :: voltar}"></a>
		
		        <h1>TeachStation</h1>
		
		        <p>
		            Aprenda no seu ritmo.
		        </p>
		
		    </section>
		    <section class="login-container cadastro-container">
		        <div class="cabecalho-cadastro">
		
		            <h2>Cadastro de Professor</h2>
		
		            <p class="texto-cadastro">
		                Preencha os dados do professor.
		            </p>
		
		        </div>
		        <form action="/cadastro/professor" method="POST">
		
		            <div class="campo-formulario">
		
		                <label for="nome">
		                    Nome Completo:
		                </label>
		
		                <input
		                    type="text"
		                    id="nome"
		                    name="nome"
		                    required>
		
		            </div>
		            <div class="linha-formulario">
		
		                <div class="campo-formulario">
		
		                    <label for="prontuario">
		                        Prontuário:
		                    </label>
		
		                    <input
		                        type="text"
		                        id="prontuario"
		                        name="prontuario"
		                        placeholder="AQ123456"
		                        pattern="AQ[0-9]+"
		                        title="O prontuário deve começar com AQ."
		                        required>
		
		                </div>
		
		                <div class="campo-formulario">
		
		                    <label for="data-nascimento">
		                        Data de Nascimento:
		                    </label>
	
		                    <input
		                        type="date"
		                        id="data-nascimento"
		                        name="data-nascimento"
		                        required>
	
		                </div>
		            </div>
		
		            <div class="campo-formulario">
		
		                <label for="email">
		                    E-mail:
		                </label>
		
		                <input
		                    type="email"
		                    id="email"
		                    name="email"
		                    required>
		
		            </div>
		
		            <div class="campo-formulario">
		
		                <label for="telefone">
		                    Telefone:
		                </label>
		
		                <input
		                    type="tel"
		                    id="telefone"
		                    name="telefone"
		                    required>
		
		            </div>
		
		            <div class="campo-formulario">
		
		            <div class="campo-formulario">
		                <label for="area-atuacao">Área de Atuação:</label>
		                <input type="text" id="area-atuacao" name="area-atuacao" placeholder="Ex: Língua Portuguesa, Matemática">
		            </div>
		            <div class="campo-formulario">
		                <label for="genero">
		                    Gênero:
		                </label>
		
		                <select
		                    id="genero"
		                    name="genero"
		                    required>
		
		                    <option value="" selected disabled>
		                        Selecione uma opção
		                    </option>
		
		                    <option value="masculino">
		                        Masculino
		                    </option>
		
		                    <option value="feminino">
		                        Feminino
		                    </option>
		
		                    <option value="outro">
		                        Outro
		                    </option>
		
		                    <option value="nao-informar">
		                        Prefiro não informar
		                    </option>
		
		                </select>
		
		            </div>
		
		            <div class="campo-formulario">
		
		                <label for="nome-social">
		                    Nome Social:
		                </label>
		
		                <input
		                    type="text"
		                    id="nome-social"
		                    name="nome-social">
		
		            </div>
					
					<div class="linha-formulario">
	                    <div class="campo-formulario">
	                        <label for="senha">
	                            Senha:
	                        </label>

	                        <div class="input-senha-wrapper">
	                            <input type="password" id="senha" name="senha" required>
	                            <button type="button" id="togglePass" class="botao-olho" aria-label="Mostrar senha" title="Mostrar senha">
	                                <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
	                                <svg class="icone-olho-fechado" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
	                            </button>
	                        </div>
	                    </div>

	                    <div class="campo-formulario">
	                        <label for="confirmar-senha">
	                            Confirmar senha:
	                        </label>

	                        <div class="input-senha-wrapper">
	                            <input type="password" id="confirmar-senha" name="confirmar-senha" required>
	                            <button type="button" id="toggleConfirmPass" class="botao-olho" aria-label="Mostrar senha" title="Mostrar senha">
	                                <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
	                                <svg class="icone-olho-fechado" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
	                            </button>
	                        </div>
	                    </div>
	                </div>
		
		            <button type="submit">
		                Cadastrar Professor
		            </button>
		
		        </form>
		
		    </section>
		</main>
		
		<div th:replace="~{fragments/toast :: toast}"></div>
		
		<div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>
		
		<script>
			"use strict"
			function configurarToggleSenha(inputId, botaoId) {
				const campo = document.getElementById(inputId);
				const botao = document.getElementById(botaoId);
				botao.onclick = function () {
					const mostrar = campo.getAttribute("type") === "password";
					campo.setAttribute("type", mostrar ? "text" : "password");
					botao.querySelector(".icone-olho-aberto").hidden = mostrar;
					botao.querySelector(".icone-olho-fechado").hidden = !mostrar;
					botao.setAttribute("title", mostrar ? "Esconder senha" : "Mostrar senha");
					botao.setAttribute("aria-label", mostrar ? "Esconder senha" : "Mostrar senha");
				};
			}
			configurarToggleSenha("senha", "togglePass");
			configurarToggleSenha("confirmar-senha", "toggleConfirmPass");
		</script>
	
	</body>
</html>
