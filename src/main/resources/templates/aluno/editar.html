<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/cadastros.css}">
    <title th:text="${aluno.id == null ? 'Novo Aluno - TeachStation' : 'Editar Aluno - TeachStation'}">Editar Aluno - TeachStation</title>
</head>
<body>
    <div th:replace="~{fragments/cabecalho :: cabecalho}"></div>

    <main class="pagina-cadastros">
        <section class="cabecalho-cadastros">
            <h1 th:text="${aluno.id == null ? 'Cadastrar Aluno' : 'Editar Aluno'}">Aluno</h1>
            <p>Preencha os dados cadastrais do aluno.</p>
        </section>

        <div class="card-formulario">
            <form method="post" th:action="@{/aluno/salvar}" th:object="${aluno}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{tipoUsuario}">

                <div class="campo-formulario" th:if="${aluno.id != null}">
                    <label>ID:</label>
                    <input type="text" disabled th:value="*{id}">
                </div>

                <div class="campo-formulario">
                    <label for="nomeCompleto">Nome Completo:</label>
                    <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" required>
                    <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></span>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="ra">RA:</label>
                        <input type="text" id="ra" th:field="*{ra}" required>
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('ra')}" th:errors="*{ra}"></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="dataNascimento">Data de Nascimento:</label>
                        <input type="date" id="dataNascimento" th:field="*{dataNascimento}" required>
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('dataNascimento')}" th:errors="*{dataNascimento}"></span>
                    </div>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" th:field="*{email}" required>
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="telefoneResponsavel">Telefone do Responsável:</label>
                        <input type="tel" id="telefoneResponsavel" th:field="*{telefoneResponsavel}" required>
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('telefoneResponsavel')}" th:errors="*{telefoneResponsavel}"></span>
                    </div>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="genero">Gênero:</label>
                        <select id="genero" th:field="*{genero}">
                            <option value="">Selecione uma opção</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Outro">Outro</option>
                            <option value="Não Informar">Prefiro não informar</option>
                        </select>
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                    </div>

                    <div class="campo-formulario">
                        <label for="nomeSocial">Apelido (Nome Social):</label>
                        <input type="text" id="nomeSocial" th:field="*{nomeSocial}">
                        <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('nomeSocial')}" th:errors="*{nomeSocial}"></span>
                    </div>
                </div>

                <div class="campo-formulario">
                    <label for="nivelAtual">Nível Atual:</label>
                    <select id="nivelAtual" th:field="*{nivelAtual}">
                        <option value="">Sem nível (fará avaliação diagnóstica)</option>
                        <option value="INICIANTE">Iniciante</option>
                        <option value="INTERMEDIARIO">Intermediário</option>
                        <option value="AVANCADO">Avançado</option>
                    </select>
                    <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('nivelAtual')}" th:errors="*{nivelAtual}"></span>
                </div>

                <div class="campo-formulario">
                    <label for="senha">Senha:</label>
                    <div class="input-senha-wrapper">
                        <input type="password" id="senha" th:field="*{senha}" th:required="${aluno.id == null}">
                        <button type="button" id="togglePass" class="botao-olho" aria-label="Mostrar senha" title="Mostrar senha">
                            <svg class="icone-olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icone-olho-fechado" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <small th:if="${aluno.id != null}" style="color: var(--cor-texto-secundario); margin-top: 4px; font-size: 13px;">
                        Deixe em branco para manter a senha atual.
                    </small>
                    <span class="mensagem-erro-campo" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
                </div>

                <div class="grupo-botoes-form">
                    <button type="submit" class="botao-primario">Salvar Aluno</button>
                    <a th:href="@{/aluno/listar}" class="botao-secundario">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 TeachStation. Todos os direitos reservados.</p>
    </footer>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>
    <script>
        "use strict"
        const senha = document.getElementById("senha");
        const togglePass = document.getElementById("togglePass");

        togglePass.onclick = function () {
            const mostrar = senha.getAttribute("type") === "password";
            senha.setAttribute("type", mostrar ? "text" : "password");
            togglePass.querySelector(".icone-olho-aberto").hidden = mostrar;
            togglePass.querySelector(".icone-olho-fechado").hidden = !mostrar;
            togglePass.setAttribute("title", mostrar ? "Esconder senha" : "Mostrar senha");
            togglePass.setAttribute("aria-label", mostrar ? "Esconder senha" : "Mostrar senha");
        };
    </script>
</body>
</html>
