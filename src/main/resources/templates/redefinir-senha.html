<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Redefinir Senha - TeachStation</title>
</head>
<body>

    <main class="pagina-login">
        <section class="apresentacao-login">
            <a th:replace="~{fragments/voltar :: voltar}"></a>
            <h1>TeachStation</h1>
            <p>Aprenda no seu ritmo.</p>
        </section>

        <section class="login-container cadastro-container">
            <div class="cabecalho-cadastro">
                <h2>Redefinir Senha</h2>
                <p class="texto-cadastro">
                    Informe seu e-mail e data de nascimento cadastrados para definir uma nova senha.
                </p>
            </div>

            <form th:action="@{/redefinir-senha}" method="POST">
                <div class="campo-formulario">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo-formulario">
                    <label for="data-nascimento">Data de Nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento" required>
                </div>

                <div class="linha-formulario">
                    <div class="campo-formulario">
                        <label for="senha">Nova Senha:</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>

                    <div class="campo-formulario">
                        <label for="confirmar-senha">Confirmar Nova Senha:</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                    </div>
                </div>

                <button type="submit">Redefinir Senha</button>
            </form>

            <p><a th:href="@{/login}">Voltar para o Login</a></p>
        </section>
    </main>

    <div th:replace="~{fragments/toast :: toast}"></div>
    <div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>

</body>
</html>
