<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Cadastro de Aluno - TeachStation</title>
</head>

<body>
	
    <main class="pagina-login">

        <section class="apresentacao-login">
            <a th:replace="~{fragments/voltar :: voltar}"></a>
            <h1>TeachStation</h1>
            <p>Aprenda no seu ritmo.</p>
        </section>

        <section class="login-container cadastro-container">

            <div class="cabecalho-cadastro">
                <h2>Cadastro de Aluno</h2>

                <p class="texto-cadastro">
                    Preencha os dados do aluno.
                </p>
            </div>

            <!-- Mensagem de erro -->
            <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>

            <form th:action="@{/signup}" method="POST">

                <div class="campo-formulario">

                    <label for="nome">
                        Nome Completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required>
                </div>


                <div class="linha-formulario">

                    <div class="campo-formulario">

                        <label for="ra">
                            RA:
                        </label>

                        <input
                            type="text"
                            id="ra"
                            name="ra"
                            required>
                    </div>


                    <div class="campo-formulario">

                        <label for="data-nascimento">
                            Data de Nascimento:
                        </label>

                        <input
                            type="date"
                            id="data-nascimento"
                            name="data-nascimento"
                            required>
                    </div>

                </div>


                <div class="campo-formulario">

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>


                <div class="campo-formulario">

                    <label for="telefone-responsavel">
                        Telefone do Responsável:
                    </label>

                    <input
                        type="tel"
                        id="telefone-responsavel"
                        name="telefone-responsavel" required>
                </div>


                <div class="campo-formulario">

                    <label for="genero">
                        Gênero:
                    </label>

                    <select
                        id="genero"
                        name="genero"
                        required>

                        <option value="" selected disabled>
                            Selecione uma opção
                        </option>

                        <option value="masculino">
                            Masculino
                        </option>

                        <option value="feminino">
                            Feminino
                        </option>

                        <option value="outro">
                            Outro
                        </option>

                        <option value="nao-informar">
                            Prefiro não informar
                        </option>

                    </select>

                </div>


                <div class="campo-formulario">

                    <label for="nome-social">
                        Apelido (Nome Social):
                    </label>

                    <input
                        type="text"
                        id="nome-social"
                        name="nome-social">

                </div>


                <div class="linha-formulario">

                    <div class="campo-formulario">

                        <label for="senha">
                            Senha:
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            required>
                        <button type="button" id="togglePass">Mostrar Senha</button>

                    </div>


                    <div class="campo-formulario">

                        <label for="confirmar-senha">
                            Confirmar senha:
                        </label>

                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            required>
                        <button type="button" id="togglePass">Mostrar Senha</button>

                    </div>

                </div>


                <button type="submit">
                    Cadastrar Aluno
                </button>

            </form>

        </section>

    </main>
	
	<div th:replace="~{fragments/toast :: toast}"></div>
	
	<div th:replace="~{fragments/vlibras :: widget-vlibras}"></div>
<script>
	"use strict"
	const input = document.querySelector("input");
	const button = document.querySelector("#togglePass");
	button.addEventListener('click', togglePass);
	
	function togglePass(){
	if (input.type == "password"){
		input.type = "text";
		button.textContent = "Esconder Senha";
		}else{
			input.type = "password";
			button.textContent = "Mostrar Senha";
		}
	}

</script>
</body>

</html>
